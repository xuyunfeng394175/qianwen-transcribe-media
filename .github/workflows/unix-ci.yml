name: macOS and Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-workflow:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: bash -n install-skill.sh qianwen-transcribe-media/scripts/*.sh

      - name: Compile Python helpers
        run: python3 -m py_compile qianwen-transcribe-media/scripts/*.py

      - name: Validate isolated browser launcher arguments
        run: |
          set +e
          result="$(python3 qianwen-transcribe-media/scripts/Launch-Debug-Chrome.py --user-data-dir "$HOME")"
          code=$?
          set -e
          test "$code" -ne 0
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          result = json.loads(os.environ["RESULT"])
          assert result["reason"] == "unsafe-user-data-directory"
          PY

          set +e
          result="$(python3 qianwen-transcribe-media/scripts/Launch-Debug-Chrome.py --user-data-dir "$RUNNER_TEMP/chrome-debug" --debug-port 80)"
          code=$?
          set -e
          test "$code" -ne 0
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          result = json.loads(os.environ["RESULT"])
          assert result["reason"] == "invalid-debug-port"
          PY

      - name: Test custom installation
        run: |
          root="$RUNNER_TEMP/custom-skills"
          ./install-skill.sh --client Custom --destination-root "$root"
          test -f "$root/qianwen-transcribe-media/SKILL.md"

      - name: Test media preflight
        run: |
          source="$RUNNER_TEMP/sample.mp3"
          output="$RUNNER_TEMP/transcripts"
          printf '\001\002\003' > "$source"
          result="$(python3 qianwen-transcribe-media/scripts/Preflight-Media.py --source-path "$source" --output-directory "$output")"
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          result = json.loads(os.environ["RESULT"])
          assert result["status"] == "ok"
          assert len(result["items"]) == 1
          assert result["items"][0]["status"] == "ready"
          PY

      - name: Test transcript finalization
        run: |
          source="$RUNNER_TEMP/sample.mp3"
          downloads="$RUNNER_TEMP/downloads"
          output="$RUNNER_TEMP/final"
          mkdir -p "$downloads"
          printf '# Transcript\n' > "$downloads/sample_原文.md"
          not_before="$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(seconds=5)).isoformat())')"
          result="$(python3 qianwen-transcribe-media/scripts/Finalize-Transcript.py --source-file "$source" --output-directory "$output" --download-directory "$downloads" --not-before "$not_before" --wait-seconds 0)"
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          import pathlib
          result = json.loads(os.environ["RESULT"])
          assert result["status"] == "completed"
          assert pathlib.Path(result["finalPath"]).is_file()
          PY

      - name: Test explicit transcript finalization
        run: |
          source="$RUNNER_TEMP/sample-explicit.mp3"
          download="$RUNNER_TEMP/sample-explicit_原文.md"
          output="$RUNNER_TEMP/final-explicit"
          printf '\001\002\003' > "$source"
          printf '# Transcript\n' > "$download"
          not_before="$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(seconds=5)).isoformat())')"
          result="$(python3 qianwen-transcribe-media/scripts/Finalize-Transcript.py --source-file "$source" --output-directory "$output" --not-before "$not_before" --downloaded-file "$download")"
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          import pathlib
          result = json.loads(os.environ["RESULT"])
          assert result["status"] == "completed"
          assert pathlib.Path(result["finalPath"]).is_file()
          PY

      - name: Test low-token batch state workflow
        run: |
          root="$RUNNER_TEMP/batch-state"
          mkdir -p "$root/media" "$root/output" "$root/state"
          printf '\001\002\003' > "$root/media/b.mp3"
          printf '\004\005\006' > "$root/media/a.mp4"
          printf '# Existing\n' > "$root/output/a_原文.md"
          script="qianwen-transcribe-media/scripts/Batch-State.py"
          python3 "$script" create --source-path "$root/media" --output-directory "$root/output" --state-directory "$root/state" --job-id ci-job
          result="$(python3 "$script" claim --state-directory "$root/state")"
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          result = json.loads(os.environ["RESULT"])
          assert result["status"] == "processing"
          assert result["fileName"] == "b.mp3"
          PY
          python3 "$script" record --state-directory "$root/state" --source-file "$root/media/b.mp3" --status completed --output-path "$root/output/b_原文.md"
          result="$(python3 "$script" status --state-directory "$root/state")"
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          result = json.loads(os.environ["RESULT"])
          assert result["completed"] == 1
          assert result["skipped"] == 1
          assert result["ready"] == 0
          PY
