name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object {
                "{0}: {1}" -f $_.Extent.File, $_.Message
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Test custom installation
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "custom-skills"
          .\install-skill.ps1 -Client Custom -DestinationRoot $root
          $skill = Join-Path $root "qianwen-transcribe-media\SKILL.md"
          if (-not (Test-Path -LiteralPath $skill -PathType Leaf)) {
            throw "Installed SKILL.md was not found: $skill"
          }

      - name: Enforce Qianwen-only transcription backend
        shell: powershell
        run: |
          $ready = py -3 .\qianwen-transcribe-media\scripts\Validate-Provider.py --provider qianwen-web-audioread | ConvertFrom-Json
          if ($ready.status -ne "ready" -or $ready.transcriptionProvider -ne "qianwen-web-audioread") { throw "Qianwen provider gate did not pass." }
          $blocked = py -3 .\qianwen-transcribe-media\scripts\Validate-Provider.py --provider whisper 2>&1
          if ($LASTEXITCODE -ne 20) { throw "Forbidden provider was not blocked." }
          $blockedJson = $blocked | ConvertFrom-Json
          if ($blockedJson.status -ne "blocked" -or $blockedJson.reason -ne "forbidden-local-or-third-party-provider") { throw "Unexpected provider gate result." }

      - name: Test media preflight
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP "sample.mp3"
          $output = Join-Path $env:RUNNER_TEMP "transcripts"
          [IO.File]::WriteAllBytes($source, [byte[]](1, 2, 3))
          $json = & ".\qianwen-transcribe-media\scripts\Preflight-Media.ps1" `
            -SourcePath $source `
            -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) {
            throw "Preflight exited with code $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.status -ne "ok" -or $result.items.Count -ne 1) {
            throw "Unexpected preflight result: $json"
          }
          if ($result.items[0].status -ne "ready") {
            throw "Dummy MP3 was not marked ready: $json"
          }

      - name: Test explicit transcript finalization
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP "sample.mp3"
          $download = Join-Path $env:RUNNER_TEMP "sample_原文.md"
          $output = Join-Path $env:RUNNER_TEMP "final"
          Set-Content -LiteralPath $download -Value "# Transcript" -Encoding UTF8
          $notBefore = (Get-Date).AddSeconds(-5)
          $json = & ".\qianwen-transcribe-media\scripts\Finalize-Transcript.ps1" `
            -SourceFile $source `
            -OutputDirectory $output `
            -NotBefore $notBefore `
            -DownloadedFile $download
          if ($LASTEXITCODE -ne 0) {
            throw "Finalization exited with code $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.status -ne "completed" -or -not (Test-Path -LiteralPath $result.finalPath -PathType Leaf)) {
            throw "Unexpected finalization result: $json"
          }

      - name: Test low-token batch state workflow
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "batch-state"
          $media = Join-Path $root "media"
          $output = Join-Path $root "output"
          $state = Join-Path $root "state"
          New-Item -ItemType Directory -Path $media, $output, $state -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $media "b.mp3"), [byte[]](1, 2, 3))
          [IO.File]::WriteAllBytes((Join-Path $media "a.mp4"), [byte[]](4, 5, 6))
          Set-Content -LiteralPath (Join-Path $output "a_原文.md") -Value "# Existing" -Encoding UTF8
          $script = Join-Path (Join-Path (Join-Path $PWD "qianwen-transcribe-media") "scripts") "Batch-State.py"
          $json = & python $script create --source-path $media --output-directory $output --state-directory $state --job-id ci-job
          if ($LASTEXITCODE -ne 0) { throw "Batch create failed: $json" }
          $claimed = & python $script claim --state-directory $state | ConvertFrom-Json
          if ($claimed.status -ne "processing" -or $claimed.fileName -ne "b.mp3") { throw "Unexpected claim result" }
          & python $script record --state-directory $state --source-file (Join-Path $media "b.mp3") --status completed --output-path (Join-Path $output "b_原文.md") | Out-Null
          $summary = & python $script status --state-directory $state | ConvertFrom-Json
          if ($summary.completed -ne 1 -or $summary.skipped -ne 1 -or $summary.ready -ne 0) { throw "Unexpected summary result" }
